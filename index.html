<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeStay — Smart Women Hostel Management System</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --plum: #1c152b;
      --plum-light: #281e3d;
      --plum-card: #34274f;
      --paper: #f8f6f2;
      --surface: #ffffff;
      --marigold: #e89b27;
      --marigold-hover: #d38715;
      --marigold-soft: rgba(232, 155, 39, 0.12);
      --sage: #2a8357;
      --sage-bg: #eaf5ef;
      --brick: #c24131;
      --brick-bg: #fbeeed;
      --ochre: #d97706;
      --ochre-bg: #fef3c7;
      --muted: #6b6377;
      --line: #e7e2d9;
      --line-subtle: #f0ebe2;
      --shadow-sm: 0 2px 8px rgba(28, 21, 43, 0.04);
      --shadow-md: 0 8px 24px rgba(28, 21, 43, 0.07);
      --shadow-lg: 0 16px 40px rgba(28, 21, 43, 0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--plum);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; }
    
    .app { min-height: 100vh; display: flex; }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: var(--plum);
      color: #fff;
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0; top: 0; bottom: 0;
      z-index: 30;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 10px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f5a623, #d97706);
      display: grid;
      place-items: center;
      color: var(--plum);
      font-weight: 800;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(232, 155, 39, 0.3);
    }
    .brand h2 {
      font-family: 'Fraunces', serif;
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .brand small {
      display: block;
      color: #b3a9c4;
      font-size: 11px;
      font-weight: 500;
      margin-top: 2px;
    }

    .portal-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 10px 18px;
    }
    .portal-tag.student { background: rgba(232, 155, 39, 0.18); color: #f8b859; border: 1px solid rgba(232, 155, 39, 0.3); }
    .portal-tag.warden { background: rgba(42, 131, 87, 0.2); color: #6ee7b7; border: 1px solid rgba(42, 131, 87, 0.3); }
    .portal-tag.admin { background: rgba(194, 65, 49, 0.2); color: #fca5a5; border: 1px solid rgba(194, 65, 49, 0.3); }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .nav button {
      color: #c5bcd3;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.18s ease;
    }
    .nav button:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
    }
    .nav button.active {
      background: rgba(232, 155, 39, 0.16);
      color: #fff;
      position: relative;
      font-weight: 700;
    }
    .nav button.active:before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--marigold);
    }
    .nav-icon {
      font-size: 17px;
      opacity: 0.9;
      width: 22px;
      text-align: center;
    }

    .sidebar-footer {
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
    }
    .sidebar-user .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--marigold);
      color: var(--plum);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
    }
    .sidebar-user-info { flex: 1; min-width: 0; }
    .sidebar-user-name { font-weight: 700; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-user-sub { font-size: 11px; color: #a9a0b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .btn-logout {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: #e5e0ec;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-logout:hover {
      background: rgba(194, 65, 49, 0.2);
      color: #fca5a5;
      border-color: rgba(194, 65, 49, 0.4);
    }

    /* MAIN CONTENT */
    .main {
      margin-left: 260px;
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 76px;
      background: rgba(248, 246, 242, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .page-title {
      font-family: 'Fraunces', serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .server-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 99px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .status-dot.offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

    .content {
      padding: 36px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    .greeting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }
    .greeting h1 {
      font-family: 'Fraunces', serif;
      font-size: 34px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .muted { color: var(--muted); font-size: 14px; }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.16s ease;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn.primary {
      background: var(--marigold);
      color: var(--plum);
      box-shadow: 0 4px 14px rgba(232, 155, 39, 0.25);
    }
    .btn.primary:hover:not(:disabled) {
      background: var(--marigold-hover);
      transform: translateY(-1px);
    }
    .btn.secondary { background: var(--plum); color: #fff; }
    .btn.secondary:hover:not(:disabled) { background: #2f2348; }
    .btn.ghost {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--plum);
    }
    .btn.ghost:hover:not(:disabled) {
      background: #f7f4ee;
      border-color: #d8d0c2;
    }
    .btn.danger { background: var(--brick-bg); color: var(--brick); }
    .btn.danger:hover:not(:disabled) { background: #f7deda; }
    .btn.success { background: var(--sage-bg); color: var(--sage); }
    .btn.success:hover:not(:disabled) { background: #d7ede1; }

    /* CARDS & GRIDS */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 22px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card:hover { box-shadow: var(--shadow-md); border-color: #ded6c9; }
    .grid { display: grid; gap: 20px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 24px; }
    .two { grid-template-columns: 1.5fr 1fr; }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .stat {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      cursor: default;
    }
    .stat-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: #f3efe8;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-weight: 700;
      font-size: 14px;
      margin-top: 4px;
    }
    .stat-context {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .section-head h3 {
      font-family: 'Fraunces', serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* BADGES */
    .badge {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.sage { background: var(--sage-bg); color: var(--sage); }
    .badge.ochre { background: var(--ochre-bg); color: var(--ochre); }
    .badge.brick { background: var(--brick-bg); color: var(--brick); }
    .badge.plum { background: #efeaf5; color: #4b3668; }

    /* SAFE RETURN RING */
    .ring-wrap {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .ring {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--sage) 0 72%, #ece7de 72%);
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(42, 131, 87, 0.15);
    }
    .ring.late {
      background: conic-gradient(var(--brick) 0 92%, #ece7de 92%);
      box-shadow: 0 4px 16px rgba(194, 65, 49, 0.2);
    }
    .ring:after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: #fff;
    }
    .ring-inner {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .ring-time {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }
    .ring small {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* TABLES */
    .table-wrap { overflow-x: auto; margin: 0 -4px; }
    .table { width: 100%; border-collapse: collapse; min-width: 700px; }
    .table th {
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 12px 14px;
      border-bottom: 2px solid var(--line);
      background: #fff;
    }
    .table td {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .table tr:hover td { background: #faf8f5; }

    /* FORMS */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 13px; font-weight: 700; color: #433952; }
    .input, .select, .textarea {
      border: 1px solid #dcd5cc;
      background: #fff;
      border-radius: 9px;
      padding: 11px 14px;
      color: var(--plum);
      outline: none;
      font-size: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--marigold);
      box-shadow: 0 0 0 3px rgba(232, 155, 39, 0.18);
    }
    .textarea { min-height: 110px; resize: vertical; }

    /* TABS */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    .tab {
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      transition: all 0.15s ease;
    }
    .tab:hover { color: var(--plum); }
    .tab.active { color: var(--plum); border-color: var(--marigold); }

    /* CHARTS */
    .chart {
      height: 220px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      padding: 20px 10px 5px;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      height: 100%;
      justify-content: flex-end;
    }
    .bar {
      width: 75%;
      max-width: 52px;
      background: linear-gradient(180deg, var(--plum-card), var(--plum));
      border-radius: 8px 8px 0 0;
      min-height: 6px;
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bar-label { font-size: 11px; font-weight: 600; color: var(--muted); }
    .bar-value { font-size: 11px; font-weight: 800; }

    /* ALERTS & BOXES */
    .alert { padding: 13px 16px; border-radius: 10px; background: #fff2ef; border: 1px solid #f9cac2; color: #8c2b1e; font-size: 13px; font-weight: 600; }
    .success-box { padding: 13px 16px; border-radius: 10px; background: #eef7f2; border: 1px solid #c8e6d4; color: #1e6340; font-size: 13px; font-weight: 600; }
    .quick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .notice.priority { border-left: 4px solid var(--brick); padding-left: 12px; }
    .notice-title { font-weight: 700; font-size: 14px; }
    .notice-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* QR BOARDING PASS CARD */
    .gate-pass-card {
      background: linear-gradient(135deg, #ffffff 0%, #fdfbf7 100%);
      border: 2px dashed #dcd5ca;
      border-radius: var(--radius-md);
      padding: 24px;
      text-align: center;
      position: relative;
    }
    .qr-box {
      width: 160px;
      height: 160px;
      margin: 14px auto;
      background: repeating-conic-gradient(#1c152b 0 25%, #ffffff 0 50%) 0 / 18px 18px;
      border: 8px solid #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      outline: 1px solid #e0d8cc;
      border-radius: 8px;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 21, 43, 0.55);
      backdrop-filter: blur(4px);
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .modal {
      background: #fff;
      border-radius: var(--radius-lg);
      max-width: 620px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: var(--shadow-lg);
      animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalFadeIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-head h2 { font-family: 'Fraunces', serif; font-size: 24px; margin: 0; font-weight: 600; }
    .close {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: #f2eee8;
      display: grid;
      place-items: center;
      font-size: 19px;
      color: var(--plum);
      transition: all 0.15s ease;
    }
    .close:hover { background: #e5dfd6; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

    /* TOAST */
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: var(--plum);
      color: #fff;
      padding: 14px 22px;
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: toastSlide 0.25s ease;
    }
    .toast.success { border-left: 6px solid #10b981; }
    .toast.error { border-left: 6px solid #ef4444; }
    @keyframes toastSlide { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* SEPARATED PORTAL LOGIN SYSTEM */
    .portal-login-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at 50% 15%, #ffffff 0%, var(--paper) 100%);
    }
    .login-container {
      width: 100%;
      max-width: 580px;
    }
    .portal-selector-bar {
      display: flex;
      background: #eae4d8;
      padding: 6px;
      border-radius: 16px;
      gap: 6px;
      margin-bottom: 22px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
    }
    .portal-pill {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #5d536a;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .portal-pill:hover { color: var(--plum); }
    .portal-pill.active {
      background: #fff;
      color: var(--plum);
      box-shadow: 0 4px 14px rgba(28, 21, 43, 0.08);
    }
    .login-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      padding: 36px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 26px;
    }
    .login-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 600;
      margin-top: 10px;
      margin-bottom: 6px;
      letter-spacing: -0.4px;
    }
    .student-chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .student-chip {
      padding: 9px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #faf8f5;
      font-size: 12px;
      text-align: left;
      transition: all 0.15s ease;
    }
    .student-chip:hover {
      border-color: var(--marigold);
      background: #fff;
      transform: translateY(-1px);
    }
    .student-chip.active {
      border-color: var(--marigold);
      background: var(--marigold-soft);
      box-shadow: 0 0 0 2px var(--marigold);
    }
    .student-chip-name { font-weight: 700; color: var(--plum); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .student-chip-room { font-size: 11px; color: var(--muted); }

    .mobile-nav { display: none; }

function getMockState() {
  try {
    const saved = localStorage.getItem('safestay_mock_state');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return INITIAL_MOCK_STATE;
}

function saveMockState(state) {
  try {
    localStorage.setItem('safestay_mock_state', JSON.stringify(state));
  } catch(e) {}
}

async function handleMockApi(path, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  const body = options.body ? JSON.parse(options.body) : {};
  const [cleanPath, queryString] = path.split('?');
  const params = new URLSearchParams(queryString || '');
  const state = getMockState();

  // /api/health
  if (cleanPath === '/api/health') {
    return { status: "healthy", service: "SafeStay Hybrid Client", timestamp: new Date().toISOString() };
  }

  // /api/public/students
  if (cleanPath === '/api/public/students') {
    const list = state.users.filter(u => u.role === 'Student').map(u => ({
      user_code: u.user_code, name: u.name, room: u.room, course: u.course, curfew_status: u.curfew_status
    }));
    return { success: true, students: list };
  }

  // /api/login
  if (cleanPath === '/api/login' && method === 'POST') {
    const user = state.users.find(u => u.user_code.toUpperCase() === (body.user_code || '').trim().toUpperCase() && u.role === body.role);
    if (!user) throw new Error(`No ${body.role} account found with ID '${body.user_code}'`);
    if (user.password !== body.password) throw new Error("Incorrect password. Please try again.");
    const safeUser = { ...user };
    delete safeUser.password;
    return { success: true, user: safeUser };
  }

  // /api/profile
  if (cleanPath === '/api/profile') {
    const userCode = params.get('user_code') || body.user_code || 'STU-2048';
    const userIdx = state.users.findIndex(u => u.user_code === userCode);
    if (userIdx === -1) throw new Error("User not found");
    if (method === 'PUT') {
      state.users[userIdx] = { ...state.users[userIdx], ...body };
      saveMockState(state);
      const safe = { ...state.users[userIdx] };
      delete safe.password;
      return { success: true, message: "Profile updated successfully", user: safe };
    }
    const safe = { ...state.users[userIdx] };
    delete safe.password;
    return { success: true, user: safe };
  }

  // /api/stats/student
  if (cleanPath === '/api/stats/student') {
    const userCode = params.get('user_code') || 'STU-2048';
    const rent = state.rent_records.filter(r => r.student_code === userCode).pop();
    const activeExit = state.exit_requests.filter(e => e.student_code === userCode && e.status === 'Approved').pop();
    const activeComplaints = state.complaints.filter(c => c.student_code === userCode && c.status !== 'Solved').length;
    return {
      success: true,
      rent: {
        amount: rent ? `₹${rent.amount.toLocaleString()}` : "₹0",
        status: rent ? rent.status : "Paid",
        due_date: rent ? rent.due_date : "—"
      },
      active_complaints: activeComplaints,
      mess_rating: "4.3/5",
      priority_notices: state.notices.filter(n => n.priority).length,
      active_exit: activeExit || null,
      activities: [
        { action: "Logged in securely", created_at: "Just now" },
        { action: "Checked curfew countdown", created_at: "5 mins ago" }
      ]
    };
  }

  // /api/stats/warden
  if (cleanPath === '/api/stats/warden') {
    const pendingExits = state.exit_requests.filter(e => e.status === 'Pending').length;
    const openComplaints = state.complaints.filter(c => c.status !== 'Solved').length;
    const outStudents = state.users.filter(u => u.role === 'Student' && u.curfew_status === 'Out');
    return {
      success: true,
      pending_exits: pendingExits,
      unattended_complaints: openComplaints,
      attendance_pending: 0,
      currently_out_count: outStudents.length,
      mess_rating: "4.3/5",
      past_curfew: 1,
      currently_out: outStudents.map(s => ({
        name: s.name, room: s.room, user_code: s.user_code, time_str: "01:45", late: false, expected_return: "11:30 PM"
      })),
      activities: [
        { action: "QR Gate scan verified — Sanskruti Patil", created_at: "18:45 PM" },
        { action: "Night roll call locked for Wing A", created_at: "21:30 PM" }
      ]
    };
  }

  // /api/stats/admin
  if (cleanPath === '/api/stats/admin') {
    return {
      success: true,
      occupancy: { percent: "95%", text: "190 / 200 beds", trend: [88, 89, 90, 91, 93, 94, 95] },
      rent: { collected: "₹15.20L", due: "₹85.00K", overdue: "₹25K", aging: [45, 28, 17, 10] },
      complaints: { open: 3, escalated: 1, categories: { labels: ["Maintenance", "Mess", "Internet", "Safety"], values: [42, 27, 18, 13] } },
      past_curfew: 2
    };
  }

  // /api/students
  if (cleanPath === '/api/students') {
    if (method === 'POST') {
      const newId = `STU-${2050 + state.users.length}`;
      const newStudent = {
        id: state.users.length + 1,
        user_code: newId,
        role: "Student",
        name: body.name || "New Resident",
        email: body.email || `${(body.name || 'student').toLowerCase().replace(/\s+/g, '')}@example.com`,
        phone: body.phone || "+91 98765 00000",
        room: body.room || "A-105",
        course: body.course || "B.Tech",
        warden_name: "Meera Sharma",
        emergency_name: "Guardian",
        emergency_phone: body.phone || "+91 98765 00000",
        status: "Active",
        curfew_status: "In",
        password: "password"
      };
      state.users.push(newStudent);
      state.rent_records.push({
        id: state.rent_records.length + 1,
        student_code: newId,
        student_name: newStudent.name,
        room: newStudent.room,
        month: "October 2026",
        amount: 8500,
        due_date: "05 Nov 2026",
        status: "Due"
      });
      saveMockState(state);
      return { success: true, message: "Student enrolled successfully", user_code: newId };
    }
    const safeStudents = state.users.filter(u => u.role === 'Student').map(u => {
      const copy = { ...u };
      delete copy.password;
      const rent = state.rent_records.filter(r => r.student_code === u.user_code).pop();
      copy.rent_status = rent ? rent.status : "Due";
      return copy;
    });
    return { success: true, students: safeStudents };
  }

  // /api/notices
  if (cleanPath === '/api/notices') {
    if (method === 'POST') {
      const newNotice = {
        id: state.notices.length + 1,
        title: body.title,
        body: body.body,
        by_role: body.by_role || "Warden",
        priority: body.priority ? 1 : 0,
        time_str: "Today, " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        expiry_date: body.expiry_date || "",
        acknowledged_by: "[]"

      state.notices.unshift(newNotice);
      saveMockState(state);
      return { success: true, message: "Notice published successfully" };
    }
    return { success: true, notices: state.notices };
  }

  if (cleanPath.startsWith('/api/notices/') && cleanPath.endsWith('/acknowledge')) {
    const id = parseInt(cleanPath.split('/')[3]);
    const notice = state.notices.find(n => n.id === id);
    if (notice) {
      let acks = [];
      try { acks = JSON.parse(notice.acknowledged_by || "[]"); } catch(e) {}
      if (!acks.includes(body.user_code)) acks.push(body.user_code);
      notice.acknowledged_by = JSON.stringify(acks);
      saveMockState(state);
    }
    return { success: true, message: "Notice acknowledged" };
  }

  if (cleanPath.startsWith('/api/notices/') && method === 'DELETE') {
    const id = parseInt(cleanPath.split('/')[3]);
    state.notices = state.notices.filter(n => n.id !== id);
    saveMockState(state);
    return { success: true, message: "Notice deleted" };
  }

  // /api/complaints
  if (cleanPath === '/api/complaints') {
    if (method === 'POST') {
      const newC = {
        id: state.complaints.length + 1,
        complaint_code: `CMP-${1050 + state.complaints.length}`,
        student_code: body.student_code || "STU-2048",
        student_name: "Sanskruti Patil",
        room: body.room || "A-204",
        category: body.category || "Maintenance",
        title: body.title || "Facility Issue",
        description: body.description || "",
        status: "Pending",
        date_str: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
      };
      state.complaints.unshift(newC);
      saveMockState(state);
      return { success: true, message: `Complaint ${newC.complaint_code} raised successfully`, complaint_code: newC.complaint_code };
    }
    const studentCode = params.get('student_code');
    const filtered = studentCode ? state.complaints.filter(c => c.student_code === studentCode) : state.complaints;
    return { success: true, complaints: filtered };
  }

  if (cleanPath.startsWith('/api/complaints/') && cleanPath.endsWith('/status')) {
    const id = parseInt(cleanPath.split('/')[3]);
    const comp = state.complaints.find(c => c.id === id);
    if (comp) comp.status = body.status;
    saveMockState(state);
    return { success: true, message: `Status updated to ${body.status}` };
  }

  // /api/exit-requests
  if (cleanPath === '/api/exit-requests') {
    if (method === 'POST') {
      const newE = {
        id: state.exit_requests.length + 1,
        request_code: `EX-${2060 + state.exit_requests.length}`,
        student_code: body.student_code || "STU-2048",
        student_name: "Sanskruti Patil",
        room: "A-204",
        date_str: body.date_str || "Today",
        time_out: body.time_out || "08:00 PM",
        expected_return: body.expected_return || "11:30 PM",
        reason: body.reason || "Personal",
        status: "Pending"
      };
      state.exit_requests.unshift(newE);
      saveMockState(state);
      return { success: true, message: `Leave request ${newE.request_code} submitted`, request_code: newE.request_code };
    }
    const studentCode = params.get('student_code');
    const filtered = studentCode ? state.exit_requests.filter(e => e.student_code === studentCode) : state.exit_requests;
    return { success: true, requests: filtered };
  }

  if (cleanPath.startsWith('/api/exit-requests/') && cleanPath.endsWith('/action')) {
    const id = parseInt(cleanPath.split('/')[3]);
    const req = state.exit_requests.find(e => e.id === id);
    if (req) req.status = body.action === 'approve' ? 'Approved' : 'Rejected';
    saveMockState(state);
    return { success: true, message: `Leave pass ${body.action}d!` };
  }

  // /api/gate/scan
  if (cleanPath === '/api/gate/scan') {
    const code = (body.code || '').trim().toUpperCase();
    const user = state.users.find(u => u.user_code === code || u.room === code || u.name.toUpperCase().includes(code));
    if (!user) throw new Error(`Code '${code}' not recognized.`);
    const newStatus = user.curfew_status === 'In' ? 'Out' : 'In';
    user.curfew_status = newStatus;
    saveMockState(state);
    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const msg = newStatus === 'In'
      ? `✓ Gate ENTRY logged: ${user.name} (Room ${user.room}) entered safely at ${timeNow}`
      : `✓ Gate EXIT logged: ${user.name} (Room ${user.room}) departed at ${timeNow}`;
    return { success: true, message: msg, student: user.name, room: user.room, curfew_status: newStatus, time: timeNow };
  }

  // /api/rent
  if (cleanPath === '/api/rent') {
    const studentCode = params.get('student_code');
    const filtered = studentCode ? state.rent_records.filter(r => r.student_code === studentCode) : state.rent_records;
    return { success: true, records: filtered };
  }

      student_code: s.user_code, name: s.name, room: s.room, course: s.course, status: "Present"
    }));
    return { success: true, records };
  }

  // /api/mess/menu
  if (cleanPath === '/api/mess/menu') {
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const menu = {};
    days.forEach(d => {
      menu[d] = {
        Breakfast: "Poha, boiled eggs / sprouts, filter coffee & tea",
        Lunch: "Dal Tadka, paneer butter masala, steamed rice, roti & salad",
        Snacks: "Vegetable cutlets / samosas, ginger tea",
        Dinner: "Aloo gobi matar, moong dal, phulkas, jeera rice & gulab jamun"
      };
    });
    return { success: true, menu };
  }

  // /api/mess/feedback
  if (cleanPath === '/api/mess/feedback') {
    if (method === 'POST') {
      state.mess_feedback.unshift({
        id: state.mess_feedback.length + 1,
        student_code: body.student_code,
        student_name: "Sanskruti Patil",
        day_of_week: body.day_of_week,
        meal_type: body.meal_type,
        rating: body.rating,
        comment: body.comment || "Great meal taste and hygiene."
      });
      saveMockState(state);
      return { success: true, message: "Feedback submitted successfully. Thank you!" };
    }
    return {
      success: true,
      averages: [4.5, 4.2, 4.0, 4.4, 3.8, 4.1, 4.6],
      days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
      comments: state.mess_feedback
    };
  }

  // /api/staff
  if (cleanPath === '/api/staff') {
    if (method === 'POST') {
      state.staff.push({ id: state.staff.length + 1, name: body.name, role: body.role, block_floor: body.block_floor, contact: body.contact, status: "Approved" });
      saveMockState(state);
      return { success: true, message: "Staff member added successfully" };
    }
    return { success: true, staff: state.staff };
  }

  // /api/settings
  if (cleanPath === '/api/settings') {
    if (method === 'PUT') {
      state.settings = { ...state.settings, ...body };
      saveMockState(state);
      return { success: true, message: "Settings updated successfully" };
    }
    return { success: true, settings: state.settings };
  }

  // /api/backup
  if (cleanPath === '/api/backup') {
    state.settings.last_backup = new Date().toLocaleString() + " (live_snapshot.db)";
    saveMockState(state);
    return { success: true, message: "Database hot backup snapshot created successfully!", last_backup: state.settings.last_backup };
  }

  // /api/reports/generate
  if (cleanPath === '/api/reports/generate') {
    const csvContent = "data:text/csv;charset=utf-8,ID,Name,Room,Status,Date\n1,Sanskruti Patil,A-204,Active,2026-10-27\n2,Aarushi Patel,A-101,Active,2026-10-27";
    return { success: true, message: "Report generated successfully", download_url: csvContent };
  }

  return { success: true };
}

async function api(path, options = {}) {
  // If not on static host, attempt connection to local Flask backend first
  if (!isStaticHosting) {
    try {
      const url = `${API_BASE}${path}`;
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      const res = await fetch(url, { ...options, headers });
      if (res.ok) {
        return await res.json();
      }
      if (res.status === 404 && !window.location.host.includes('127.0.0.1') && !window.location.host.includes('localhost')) {
        isStaticHosting = true;
      } else {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `Request failed (${res.status})`);
      }
    } catch (err) {
      if (!window.location.host.includes('127.0.0.1') && !window.location.host.includes('localhost')) {
        isStaticHosting = true;
      } else {
        throw err;
      }
    }
  }

  // Fallback to client-side reactive mock engine for GitHub Pages
  return handleMockApi(path, options);
}

    Pending: "ochre", "In Progress": "ochre", Solved: "sage", Paid: "sage",
    Due: "ochre", Overdue: "brick", Approved: "sage", Rejected: "brick",

  };
  return <span className={"badge " + (map[status] || "plum")}>● {status}</span>;
}

function StudentNotices({ currentUser, showToast }) {
  const [notices, setNotices] = useState([]);

  const loadNotices = useCallback(() => {
    api('/api/notices').then(res => setNotices(res.notices || [])).catch(console.error);
  }, []);

  useEffect(() => { loadNotices(); }, [loadNotices]);

  const ack = async (id) => {
    try {
      await api(`/api/notices/${id}/acknowledge`, {
        method: 'POST',
        body: JSON.stringify({ user_code: currentUser.user_code })
      });
      showToast("✓ Notice acknowledged.");
      loadNotices();
    } catch (e) {
      showToast(e.message, "error");
    }
  };

  return (
    <div className="card">
      <div className="section-head">
        <h3>Hostel Notice Board</h3>
        <span className="muted">Broadcast feed from Warden & Administration</span>
      </div>
      <div className="list">
        {notices.map(n => {
          let acks = [];
          try {
            acks = Array.isArray(n.acknowledged_by) ? n.acknowledged_by : JSON.parse(n.acknowledged_by || "[]");
          } catch(e) { acks = []; }
          const isAcked = acks.includes(currentUser.user_code);

          return (
            <div className={"card notice " + (n.priority ? "priority" : "")} key={n.id} style={{ boxShadow: "none" }}>
              <div className="section-head">
                <div>
                  <h3 style={{ fontFamily: "Fraunces", fontSize: 17 }}>{n.title}</h3>
                  <div className="notice-meta">{n.by_role} • {n.time_str}</div>
                </div>
                {n.priority ? <Badge status={isAcked ? "Solved" : "Pending"} /> : null}
              </div>
              <p className="muted" style={{ fontSize: 14 }}>{n.body}</p>
              {n.priority && (
                <button
                  className={"btn " + (isAcked ? "ghost" : "primary")}
                  style={{ marginTop: 10, padding: "7px 14px" }}
                  onClick={() => !isAcked && ack(n.id)}
                  disabled={isAcked}
                >
                  {isAcked ? "✓ Notice Acknowledged" : "Acknowledge Notice"}
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function WardenAttendance({ showToast }) {
  const [students, setStudents] = useState([]);
  const [floor, setFloor] = useState("All floors");
  const [search, setSearch] = useState("");

  const load = useCallback(() => {
    api('/api/attendance').then(res => setStudents(res.records || [])).catch(console.error);
  }, []);

  useEffect(() => { load(); }, [load]);

  const toggle = (code, status) => {
    setStudents(prev => prev.map(s => s.student_code === code ? { ...s, status } : s));
  };

  const markAll = (status) => {
    setStudents(prev => prev.map(s => ({ ...s, status })));
  };

  const submit = async () => {
    try {
      await api('/api/attendance', {
        method: 'POST',
        body: JSON.stringify({
          records: students.map(s => ({ student_code: s.student_code, status: s.status }))
        })
      });
      showToast("✓ Daily attendance recorded in database!");
    } catch (e) {
      showToast(e.message, "error");
    }
  };

  const filtered = students.filter(s => {
    const matchSearch = s.name.toLowerCase().includes(search.toLowerCase()) || s.room.toLowerCase().includes(search.toLowerCase());
    const matchFloor = floor === "All floors" || (floor === "Floor 1" && s.room.startsWith("A-1")) || (floor === "Floor 2" && s.room.startsWith("A-2"));
    return matchSearch && matchFloor;
  });

  return (
    <div className="card">
      <div className="toolbar" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <div>
          <h3 style={{ fontFamily: "Fraunces", margin: "0 0 4px" }}>Daily Roll-Call Register</h3>
          <div className="muted">{new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} • {filtered.length} Residents</div>
        </div>
        <div className="filters">
          <input className="input" placeholder="Search resident or room" value={search} onChange={e => setSearch(e.target.value)} />
          <select className="select" value={floor} onChange={e => setFloor(e.target.value)}>
            <option>All floors</option>
            <option>Floor 1</option>
            <option>Floor 2</option>
          </select>
          <button className="btn ghost" onClick={() => markAll("Present")}>All Present</button>
        </div>
      </div>

      <div className="table-wrap">
        <table className="table">
          <thead><tr><th>Student Name</th><th>Room</th><th>Course</th><th>Roll-Call Status</th></tr></thead>
          <tbody>
            {filtered.map(s => (
              <tr key={s.student_code}>
                <td><b>{s.name}</b></td>
                <td>{s.room}</td>
                <td>{s.course}</td>
                <td>
                  <button className={"btn " + (s.status === "Present" ? "success" : "ghost")} style={{ padding: "6px 12px", marginRight: 8 }} onClick={() => toggle(s.student_code, "Present")}>
                    ✓ Present
                  </button>
                  <button className={"btn " + (s.status === "Absent" ? "danger" : "ghost")} style={{ padding: "6px 12px" }} onClick={() => toggle(s.student_code, "Absent")}>
                    Absent
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 20 }}>
        <button className="btn primary" onClick={submit}>Submit & Lock Attendance</button>
      </div>
    </div>
  );
}

function WardenComplaints({ showToast }) {
  const [complaints, setComplaints] = useState([]);
  const [status, setStatus] = useState("All statuses");
  const [category, setCategory] = useState("All categories");
  const [search, setSearch] = useState("");

  const load = useCallback(() => {
    let url = `/api/complaints?search=${encodeURIComponent(search)}`;
    if (status !== "All statuses") url += `&status=${encodeURIComponent(status)}`;
    if (category !== "All categories") url += `&category=${encodeURIComponent(category)}`;
    api(url).then(res => setComplaints(res.complaints || [])).catch(console.error);
  }, [status, category, search]);

  useEffect(() => { load(); }, [load]);

  const update = async (id, newStatus) => {
    try {
      await api(`/api/complaints/${id}/status`, {
        method: 'PUT',
        body: JSON.stringify({ status: newStatus })
      });
      showToast(`✓ Complaint moved to ${newStatus}`);
      load();
    } catch (e) {
      showToast(e.message, "error");
    }
  };

  return (
    <div className="card">
      <div className="toolbar" style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 20 }}>
        <input className="input" placeholder="Search complaints or room" value={search} onChange={e => setSearch(e.target.value)} />
        <select className="select" value={status} onChange={e => setStatus(e.target.value)}>
          <option>All statuses</option>
          <option>Pending</option>
          <option>In Progress</option>
          <option>Solved</option>
        </select>
        <select className="select" value={category} onChange={e => setCategory(e.target.value)}>
          <option>All categories</option>
          <option>Maintenance</option>
          <option>Mess</option>
          <option>Internet</option>
          <option>Safety</option>
        </select>
      </div>

      <div className="table-wrap">
        <table className="table">
          <thead><tr><th>Code</th><th>Grievance</th><th>Resident</th><th>Category</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
          <tbody>
            {complaints.map(c => (
              <tr key={c.id}>
                <td><b>{c.complaint_code}</b></td>
                <td>
                  <b>{c.title}</b>
                  {c.description && <div className="notice-meta">{c.description}</div>}
                </td>
                <td>{c.student_name} (Room {c.room})</td>
                <td>{c.category}</td>
                <td><Badge status={c.status} /></td>
                <td>{c.date_str}</td>
                <td>
                  <div className="quick">
                    {c.status !== "Solved" && (
                      <button className="btn success" style={{ padding: "5px 9px", fontSize: 12 }} onClick={() => update(c.id, "Solved")}>
                        Mark Solved
                      </button>
                    )}
                    {c.status === "Pending" && (
                      <button className="btn ghost" style={{ padding: "5px 9px", fontSize: 12 }} onClick={() => update(c.id, "In Progress")}>
                        In Progress
                      </button>
                    )}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function WardenNotices({ showToast }) {
  const [notices, setNotices] = useState([]);
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [priority, setPriority] = useState("Normal");
  const [expiry, setExpiry] = useState("");

  const load = useCallback(() => {
    api('/api/notices').then(res => setNotices(res.notices || [])).catch(console.error);
  }, []);

  useEffect(() => { load(); }, [load]);

  const publish = async () => {
    if (!title || !body) return showToast("Title and message body are required", "error");
    try {
      await api('/api/notices', {
        method: 'POST',
        body: JSON.stringify({
          title, body,
          priority: priority === "Priority",
          expiry_date: expiry,
          by_role: "Warden"
        })
      });
      showToast("✓ Notice published to all residents!");
      setTitle(""); setBody("");
      load();
    } catch (e) {
      showToast(e.message, "error");
    }
  };

  const remove = async (id) => {
    try {
      await api(`/api/notices/${id}`, { method: 'DELETE' });
      showToast("Notice deleted");
      load();
    } catch (e) {
      showToast(e.message, "error");
    }
  };

  return (
    <div className="grid two">
      <div className="card">
        <div className="section-head"><h3>Broadcast New Notice</h3></div>
        <div className="form-grid">
          <div className="field full"><label>Notice Headline</label><input className="input" placeholder="e.g. Tank Maintenance" value={title} onChange={e => setTitle(e.target.value)} /></div>
          <div className="field full"><label>Message Content</label><textarea className="textarea" placeholder="Detailed instruction..." value={body} onChange={e => setBody(e.target.value)}></textarea></div>
          <div className="field"><label>Priority Tag</label><select className="select" value={priority} onChange={e => setPriority(e.target.value)}><option>Normal</option><option>Priority</option></select></div>
          <div className="field"><label>Auto-Expiry Date</label><input className="input" type="date" value={expiry} onChange={e => setExpiry(e.target.value)} /></div>
        </div>
        <div className="modal-actions"><button className="btn primary" onClick={publish}>Publish Notice</button></div>
      </div>

      <div className="card">
        <div className="section-head"><h3>Active Broadcasts</h3></div>
        <div className="list">
          {notices.map(n => (
            <div className="row" key={n.id}>
              <div>
                <b>{n.title}</b>
                <div className="notice-meta">{n.time_str} • Author: {n.by_role}</div>
              </div>
              <button className="btn danger" style={{ padding: "6px 10px", fontSize: 12 }} onClick={() => remove(n.id)}>Delete</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

          )}

          <form onSubmit={handleSignIn}>
            <div className="field" style={{ marginBottom: 14 }}>
              <label>
                {selectedPortal === "Student" ? "Student Roll ID" : selectedPortal === "Warden" ? "Warden Authorization Code" : "Administrator ID"}
              </label>
              <input
                className="input"
                placeholder={selectedPortal === "Student" ? "Enter Student ID (e.g. STU-2048)" : selectedPortal === "Warden" ? "Enter Warden Code (e.g. WARD-001)" : "Enter Admin ID (e.g. ADMIN-001)"}
                value={userCode}
                onChange={e => setUserCode(e.target.value)}
                required
              />
            </div>

            <div className="field" style={{ marginBottom: 22 }}>
              <label>Password</label>
              <input
                className="input"
                type="password"
                placeholder="Enter your password"
                value={password}
                onChange={e => setPassword(e.target.value)}
                required
              />
            </div>

            <button className="btn primary" style={{ width: "100%", padding: "13px", fontSize: 15 }} type="submit" disabled={loading}>
              {loading ? "Verifying..." : `Enter ${selectedPortal} Portal →`}
            </button>
          </form>

          <div style={{ marginTop: 22, display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, color: "var(--muted)" }}>
            <span>🔒 Encrypted Portal Access</span>
            <span className="server-status">
              <span className={`status-dot ${serverOnline ? 'online' : 'offline'}`}></span>
              {serverOnline ? 'Database Connected' : 'Connecting'}
            </span>
          </div>
        </div>

      </div>
    </div>
  );
}

// ==========================================
// 5. INTERACTIVE MODAL COMPONENT
// ==========================================
function InteractiveModal({ type, close, callback, currentUser, showToast }) {
  const [form, setForm] = useState({});
  const [submitting, setSubmitting] = useState(false);

  const submit = async () => {
    setSubmitting(true);
    try {
      if (type === "complaint") {
        await api('/api/complaints', {
          method: 'POST',
          body: JSON.stringify({
            student_code: currentUser.user_code,
            category: form.category || "Maintenance",
            room: form.room || currentUser.room || "A-204",
            title: form.title || form.description?.slice(0, 30) || "Hostel Maintenance Request",
            description: form.description || ""
          })
        });
        showToast("✓ Complaint submitted successfully!");
      } else if (type === "exit") {
        await api('/api/exit-requests', {
          method: 'POST',
          body: JSON.stringify({
            student_code: currentUser.user_code,
            date_str: form.date_str || new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }),
            time_out: form.time_out || "08:00 PM",
            expected_return: form.expected_return || "11:30 PM",
            reason: form.reason || "Personal"
          })
        });
        showToast("✓ Exit request sent to Warden for clearance!");
      } else if (type === "scan") {
        const res = await api('/api/gate/scan', {
          method: 'POST',
          body: JSON.stringify({ code: form.code })
        });
        showToast(res.message);
      } else if (type === "notice") {
        await api('/api/notices', {
          method: 'POST',
          body: JSON.stringify({
            title: form.title,
            body: form.body,
            priority: form.priority === "Priority"
          })
        });
        showToast("✓ Announcement published!");
      } else if (type === "reminder") {
        const res = await api('/api/rent/remind', { method: 'POST' });
        showToast(res.message);
      } else if (type === "add-student") {
        const res = await api('/api/students', {
          method: 'POST',
          body: JSON.stringify(form)
        });
        showToast(`✓ New student enrolled! ID: ${res.user_code || ''} (Password: password)`);
      } else if (type === "add-staff") {
        await api('/api/staff', {
          method: 'POST',
          body: JSON.stringify(form)
        });
        showToast("✓ Staff member added!");
      } else if (type === "export") {
        const res = await api('/api/reports/generate', {
          method: 'POST',
          body: JSON.stringify({ type: form.type || 'Rent ledger', format: 'CSV' })
        });
        window.open(API_BASE + res.download_url, '_blank');
        showToast("✓ Operational data snapshot exported to CSV!");
      }
      if (callback) callback();
      close();
    } catch (e) {
      showToast(e.message, "error");
    } finally {
      setSubmitting(false);
    }
  };

  const titles = {
    complaint: "Raise a Hostel Complaint",
    exit: "Apply for Leave / Exit Clearance",
    scan: "Hostel Gate Pass Scanner",
    notice: "Publish Notice to Residents",
    reminder: "Dispatch Rent Reminders",
    export: "Export Live Dashboard Metrics",
    "add-student": "Enroll New Resident Student",
    "add-staff": "Add Warden / Security Staff"
  };

  return (
    <div className="modal-backdrop" onMouseDown={e => e.target === e.currentTarget && close()}>
      <div className="modal">
        <div className="modal-head">
          <h2>{titles[type] || "Action"}</h2>
          <button className="close" onClick={close}>×</button>
        </div>

        {type === "complaint" && (
          <div className="form-grid">
            <div className="field">
              <label>Category</label>
              <select className="select" defaultValue="Maintenance" onChange={e => setForm({ ...form, category: e.target.value })}>
                <option>Maintenance</option>
                <option>Internet</option>
                <option>Mess</option>
                <option>Safety</option>
              </select>
            </div>
            <div className="field">
              <label>Room / Wing</label>
              <input className="input" defaultValue={currentUser?.room || "A-204"} onChange={e => setForm({ ...form, room: e.target.value })} />
            </div>
            <div className="field full">
              <label>Issue Headline</label>
              <input className="input" placeholder="e.g. Geyser not heating properly" onChange={e => setForm({ ...form, title: e.target.value })} />
            </div>
            <div className="field full">
              <label>Description Details</label>
              <textarea className="textarea" placeholder="Provide details to help the maintenance team..." onChange={e => setForm({ ...form, description: e.target.value })}></textarea>
            </div>
          </div>
        )}

        {type === "exit" && (
          <div className="form-grid">
            <div className="field"><label>Date</label><input className="input" type="date" defaultValue={new Date().toISOString().split('T')[0]} onChange={e => setForm({ ...form, date_str: e.target.value })} /></div>
            <div className="field"><label>Departure Time</label><input className="input" type="time" defaultValue="20:00" onChange={e => setForm({ ...form, time_out: e.target.value })} /></div>
            <div className="field"><label>Expected Return Time</label><input className="input" type="time" defaultValue="23:30" onChange={e => setForm({ ...form, expected_return: e.target.value })} /></div>
            <div className="field">
              <label>Reason</label>
              <select className="select" defaultValue="Personal" onChange={e => setForm({ ...form, reason: e.target.value })}>
                <option>Personal</option>
                <option>Family event</option>
                <option>College work</option>
                <option>Library / Study group</option>
                <option>Medical visit</option>
              </select>
            </div>
          </div>
        )}

        {type === "scan" && (
          <div>
            <div className="qr-box"></div>
            <p className="muted" style={{ textAlign: "center", marginBottom: 14 }}>
              Enter Resident Student Roll ID or Exit Pass Code to check in/out:
            </p>
            <input
              className="input"
              style={{ width: "100%", fontSize: 16 }}
              placeholder="e.g. STU-2048 or EX-2048"
              autoFocus
              onChange={e => setForm({ ...form, code: e.target.value })}
              onKeyDown={e => e.key === "Enter" && submit()}
            />
          </div>
        )}

        {type === "notice" && (
          <div className="form-grid">
            <div className="field full"><label>Notice Headline</label><input className="input" placeholder="Notice headline..." onChange={e => setForm({ ...form, title: e.target.value })} /></div>
            <div className="field full"><label>Body Content</label><textarea className="textarea" placeholder="Write announcement details..." onChange={e => setForm({ ...form, body: e.target.value })}></textarea></div>
            <div className="field"><label>Priority Flag</label><select className="select" defaultValue="Normal" onChange={e => setForm({ ...form, priority: e.target.value })}><option>Normal</option><option>Priority</option></select></div>
          </div>
        )}

        {type === "reminder" && (
          <div>
            <p>You are broadcasting automated payment reminders to residents with pending fee dues.</p>
            <div className="alert" style={{ marginTop: 12 }}>Notifications will be dispatched via registered channels.</div>
          </div>
        )}

        {type === "export" && (
          <div>
            <p>Export operational data snapshot to CSV:</p>
            <div className="form-grid" style={{ marginTop: 12 }}>
              <div className="field">
                <label>Report Type</label>
                <select className="select" defaultValue="Rent ledger" onChange={e => setForm({ ...form, type: e.target.value })}>
                  <option>Rent ledger</option>
                  <option>Occupancy</option>
                  <option>Complaint log</option>
                  <option>Attendance</option>
                </select>
              </div>
              <div className="field"><label>Format</label><select className="select"><option>CSV</option></select></div>
            </div>
          </div>
        )}

        {type === "add-student" && (
          <div className="form-grid">
            <div className="field"><label>Full Name</label><input className="input" placeholder="e.g. Ananya Roy" onChange={e => setForm({ ...form, name: e.target.value })} /></div>
            <div className="field"><label>Room Number</label><input className="input" placeholder="e.g. A-105" onChange={e => setForm({ ...form, room: e.target.value })} /></div>
            <div className="field"><label>Course & Dept</label><input className="input" placeholder="e.g. B.Tech CS" onChange={e => setForm({ ...form, course: e.target.value })} /></div>
            <div className="field"><label>Phone Number</label><input className="input" placeholder="e.g. 98765 43210" onChange={e => setForm({ ...form, phone: e.target.value })} /></div>
          </div>
        )}

        {type === "add-staff" && (
          <div className="form-grid">
            <div className="field"><label>Staff Name</label><input className="input" placeholder="e.g. Sunita Kulkarni" onChange={e => setForm({ ...form, name: e.target.value })} /></div>
            <div className="field"><label>Role / Designation</label><input className="input" placeholder="e.g. Assistant Warden" onChange={e => setForm({ ...form, role: e.target.value })} /></div>
            <div className="field"><label>Block Assignment</label><input className="input" placeholder="e.g. Block A • Floor 2" onChange={e => setForm({ ...form, block_floor: e.target.value })} /></div>
            <div className="field"><label>Phone Contact</label><input className="input" placeholder="e.g. +91 98765 30005" onChange={e => setForm({ ...form, contact: e.target.value })} /></div>
          </div>
        )}

        <div className="modal-actions">
          <button className="btn ghost" onClick={close} disabled={submitting}>Cancel</button>
          <button className="btn primary" onClick={submit} disabled={submitting}>
            {submitting ? "Processing..." : type === "scan" ? "Log Gate Movement" : "Confirm & Submit"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ==========================================
// 6. MAIN APPLICATION ROOT
// ==========================================
function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [serverOnline, setServerOnline] = useState(false);

  const showToast = useCallback((msg, type = "success") => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, msg, type }]);
    setTimeout(() => {
      setToasts(prev => prev.filter(t => t.id !== id));
    }, 4000);
  }, []);

  // Heartbeat to check backend health
  useEffect(() => {
    const check = () => {
      api('/api/health')
        .then(() => setServerOnline(true))
        .catch(() => setServerOnline(false));
    };
    check();
    const timer = setInterval(check, 10000);
    return () => clearInterval(timer);
  }, []);

  const handleLoginSuccess = (user) => {
    setCurrentUser(user);
    showToast(`Signed in to ${user.role} Portal as ${user.name}`);
  };

  const handleLogout = () => {
    setCurrentUser(null);
    showToast("Signed out successfully.");
  };

  return (
    <>
      {!currentUser ? (
        <SeparatedLoginPortal onLoginSuccess={handleLoginSuccess} serverOnline={serverOnline} />
      ) : currentUser.role === "Student" ? (
        <StudentPortal currentUser={currentUser} onLogout={handleLogout} showToast={showToast} />
      ) : currentUser.role === "Warden" ? (
        <WardenPortal currentUser={currentUser} onLogout={handleLogout} showToast={showToast} />
      ) : (
        <AdminPortal currentUser={currentUser} onLogout={handleLogout} showToast={showToast} />
      )}

      <div className="toast-container">
        {toasts.map(t => (
          <div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
